name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy web to walk-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout walkadmin-react
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${WALK_SERVER##*@}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          # rsync 退出码 24 = 部分传输（某些文件被跳过），通常是可接受的，
          # 不阻断后续 build。
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            . \
            "$WALK_SERVER:$WALK_REMOTE_DIR/walkadmin-react/" || {
              code=$?
              if [ "$code" -eq 24 ]; then
                echo "rsync exit 24 (partial transfer / some files skipped) — continuing"
              else
                exit $code
              fi
            }

      - name: Verify sync succeeded
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          ssh "$WALK_SERVER" "test -f $WALK_REMOTE_DIR/walkadmin-react/Dockerfile" || { echo "Sync failed: Dockerfile missing"; exit 1; }
          echo "Sync verified."

      - name: Build and restart web
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose build web"
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose up -d web"
