name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy web to walk-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout walkadmin-react
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${WALK_SERVER##*@}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          # tar + ssh 替代 rsync：避免 CI runner 上 rsync 偶发退出码非零的问题。
          # 先清空目标目录（保留 .env 和 compose 无关文件），再解压新代码。
          ssh "$WALK_SERVER" "rm -rf $WALK_REMOTE_DIR/walkadmin-react && mkdir -p $WALK_REMOTE_DIR/walkadmin-react"
          tar czf - \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            . \
            | ssh "$WALK_SERVER" "tar xzf - -C $WALK_REMOTE_DIR/walkadmin-react/"
          ssh "$WALK_SERVER" "test -f $WALK_REMOTE_DIR/walkadmin-react/Dockerfile" || { echo "Sync failed: Dockerfile missing"; exit 1; }

      - name: Build and restart web
        env:
          WALK_SERVER: ${{ secrets.WALK_SERVER }}
          WALK_REMOTE_DIR: ${{ secrets.WALK_REMOTE_DIR }}
        run: |
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose build web"
          ssh "$WALK_SERVER" "cd $WALK_REMOTE_DIR/deploy && docker compose up -d web"
