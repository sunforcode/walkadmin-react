# 前端静态资源 + 后端反向代理
#
# 浏览器只与本 Nginx 通信，后端与 Agent 服务都不直接暴露：
# - /walkbg/  -> walkbg 后端
# - 其余路径  -> 前端静态文件（SPA）
#
# Agent 服务（kml-agent:8001）故意不在此暴露：
# 它只应由 walkbg 后端在内网调用，浏览器无需也不应直达。

server {
    listen 80;
    # 列出域名并保留 `_` 兜底：备案完成前仍需通过 IP 直连访问，
    # 去掉 `_` 会使按 IP 或其他 Host 的请求无法匹配到本 server 块。
    server_name vialu.cn www.vialu.cn _;

    # Docker 内建 DNS，配合下方变量形式的 proxy_pass 使用。
    # 原因：Nginx 对写死的 upstream 主机名只在启动时解析一次，
    # 后端容器晚于本容器启动时会直接 host not found 启动失败；
    # 后端重建换 IP 后也会一直代理到旧地址。
    # 改为「resolver + 变量」后，解析推迟到每次请求，二者都能避免。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上游地址集中在此定义，拆分主机部署时只改这一处
    set $walkbg_upstream "http://walkbg:8080";

    # 前端构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 上传 KML 时请求体可能较大，放宽限制（默认仅 1M）
    client_max_body_size 20m;

    # gzip 压缩：JS bundle 体积较大，压缩后显著减少首屏传输量
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript application/wasm text/xml application/xml
               image/svg+xml;
    gzip_min_length 1024;

    # ---------- 后端接口反向代理 ----------
    # 注意 location 与 proxy_pass 都保留 /walkbg 前缀：
    # 后端 context-path 就是 /walkbg，不做路径重写，前后端路径一致。
    location /walkbg/ {
        # 变量形式：延迟到请求时解析，且保留原始 URI 不做重写
        proxy_pass $walkbg_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KML 分析是长耗时任务，读超时需大于分析时长，
        # 否则请求会在分析完成前被 Nginx 掐断（默认仅 60s）。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---------- SSE 长连接单独处理 ----------
    # 任务进度通过 Server-Sent Events 推送，必须关闭缓冲：
    # Nginx 默认会缓冲响应，导致事件攒在缓冲区里不下发，
    # 前端表现为「进度一直不动，最后一次性全出来」。
    location /walkbg/api/v1/route-analysis/tasks/ {
        proxy_pass $walkbg_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 关键三项
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 静态资源缓存 ----------
    # 带哈希的构建产物可长期缓存，文件名变化即缓存失效。
    # 只用 add_header 设置一次 Cache-Control：
    # 同时使用 expires 会额外产生一个 max-age 的 Cache-Control 头，
    # 出现两个同名响应头，immutable 语义可能被忽略。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- Flutter Web 应用 ----------
    # 与 Admin 前端共用本 Nginx，挂在 /app/ 子路径下。
    # 产物以数据卷挂载（非打进镜像），更新时只需覆盖文件、无需重建镜像。
    # 构建命令须带 --base-href /app/，否则页面内资源引用会指向根路径而 404。
    location /app/ {
        alias /usr/share/nginx/flutter/;
        # Flutter 同样是前端路由，深链接需回退到自己的 index.html
        try_files $uri $uri/ /app/index.html;
    }

    # CanvasKit、字体和图片资源可跨访问复用。路径未包含内容哈希，
    # 因此使用一周缓存而非 immutable，避免 Flutter 升级后长期命中旧资源。
    location ~* ^/app/((?:canvaskit|assets|icons)/.*\.(?:js|wasm|woff2?|ttf|otf|png|jpe?g|webp|svg))$ {
        alias /usr/share/nginx/flutter/$1;
        add_header Cache-Control "public, max-age=604800";
    }

    # 入口协调文件没有内容哈希，发版后必须重新校验，避免新旧资源混用。
    location ~* ^/app/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|manifest\.json|version\.json)$ {
        alias /usr/share/nginx/flutter/$1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- SPA 路由回退 ----------
    # 前端使用 BrowserRouter，刷新 /routes 这类路径时
    # 服务器上并不存在对应文件，必须回退到 index.html
    # 交由前端路由处理，否则直接 404。
    location / {
        try_files $uri $uri/ /index.html;

        # index.html 不能缓存：否则前端发版后用户仍加载旧版本，
        # 而旧 index.html 引用的哈希资源可能已不存在。
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
